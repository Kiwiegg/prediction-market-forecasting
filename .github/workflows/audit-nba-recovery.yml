name: Audit or reviewed owner release (no paid calls)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, release-owner]
        default: audit
      audit_sha256:
        type: string
        description: Exact sanitized audit digest after operator review
      confirm_release:
        type: boolean
        default: false
        description: Confirm reviewed exact-owner release; circuits and paid work stay disabled
permissions:
  contents: read
  actions: read
concurrency:
  group: nba-prospective-news-v1-private-store
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.sha == vars.NBA_ACTIONS_REVIEWED_SHA &&
      vars.NBA_ACTIONS_ADMIN_ENABLED == 'true' &&
      vars.NBA_ACTIONS_LIVE_ENABLED == 'false'
    environment: nba-prospective-live
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.2'
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r deploy/github-actions/requirements.txt
      - name: Verify failed worker terminated
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Kiwiegg/prediction-market-forecasting/actions/runs/40600612996 > "$RUNNER_TEMP/termination.json"
      - name: Restore, reconcile all claims and replay saved evidence only
        env:
          NBA_ACTIONS_BUCKET: ${{ secrets.NBA_ACTIONS_BUCKET }}
          NBA_ACTIONS_ENDPOINT: ${{ secrets.NBA_ACTIONS_ENDPOINT }}
          NBA_ACTIONS_STORE_UUID: ${{ secrets.NBA_ACTIONS_STORE_UUID }}
          AWS_REGION: ${{ vars.NBA_STORAGE_REGION || 'auto' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NBA_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NBA_STORAGE_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          NBA_ACTIONS_LIVE_ENABLED: ${{ vars.NBA_ACTIONS_LIVE_ENABLED }}
          RECOVERY_MODE: ${{ inputs.mode }}
          EXPECTED_AUDIT_SHA: ${{ inputs.audit_sha256 }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          args=(--termination-proof "$RUNNER_TEMP/termination.json" --output "$RUNNER_TEMP/recovery-audit/audit.json")
          if test "$RECOVERY_MODE" = release-owner; then
            test "$CONFIRM_RELEASE" = true
            args+=(--release-owner --confirm-reviewed-release --audit-sha256 "$EXPECTED_AUDIT_SHA")
          fi
          .venv/bin/python scripts/audit_blocked_campaign.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanitized-blocked-campaign-audit
          path: ${{ runner.temp }}/recovery-audit/audit.json
          if-no-files-found: error
          retention-days: 30
