name: Prospective NBA (disabled until authorized)
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run is offline; all other modes require separate activation'
        type: choice
        options: [dry-run, bootstrap, discover, repair-discover, authorize, expand, status, replay, live]
        default: dry-run
      game_id:
        description: 'One verified game ID for initial authorization'
        type: string
      expires:
        description: 'Explicit UTC authorization expiry, at most 31 days'
        type: string
      game_limit:
        description: 'Expansion only: explicit cumulative game cap after first live success'
        type: number
        default: 1
      automatic_enrollment:
        description: 'Expansion only: authorize chronological automatic enrollment'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nba-prospective-news-v1-private-store
  cancel-in-progress: false
jobs:
  gates:
    name: Authorization diagnostics (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      private_authorized: ${{ steps.check.outputs.private_authorized }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: check
        name: Explain gate decisions without credentials
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ vars.NBA_ACTIONS_REVIEWED_SHA }}
          ADMIN_FLAG: ${{ vars.NBA_ACTIONS_ADMIN_ENABLED }}
          LIVE_FLAG: ${{ vars.NBA_ACTIONS_LIVE_ENABLED }}
        run: python3 scripts/actions_gates.py
  offline:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    # Historical replay checks are byte-exact against Darwin/arm64 outputs.
    # Use GitHub's hosted Mac, not the operator's Mac; live worker stays Linux.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.2'
      - run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python scripts/actions_prospective.py
          .venv/bin/python scripts/actions_prospective.py --validate-assets
          .venv/bin/python -m unittest discover -s tests -q
          .venv/bin/python scripts/cloud_prospective.py --replay-public reports/prospective_cloud_news_v1/simulation
  private-worker:
    needs: gates
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' &&
      github.sha == vars.NBA_ACTIONS_REVIEWED_SHA &&
      needs.gates.outputs.private_authorized == 'true'
    environment: nba-prospective-live
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.2'
      - name: Install reviewed dependencies and verify clock/assets (no provider secrets)
        run: |
          umask 077
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt -r deploy/github-actions/requirements.txt
          .venv/bin/python scripts/actions_prospective.py --validate-assets
          test "$(timedatectl show -p NTPSynchronized --value)" = yes
      - name: Confirm the zero-request failed runner terminated
        if: inputs.mode == 'repair-discover'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ended=$(gh api repos/Kiwiegg/prediction-market-forecasting/actions/runs/40321487047 --jq '[.status,.conclusion,(.run_attempt|tostring),.head_sha] | join(" ")')
          test "$ended" = 'completed failure 1 a99b24a9021a833c1899041048fc12ec7636553b'
      - name: Private bounded worker
        env:
          NBA_ACTIONS_BUCKET: ${{ secrets.NBA_ACTIONS_BUCKET }}
          NBA_ACTIONS_ENDPOINT: ${{ secrets.NBA_ACTIONS_ENDPOINT }}
          NBA_ACTIONS_STORE_UUID: ${{ secrets.NBA_ACTIONS_STORE_UUID }}
          AWS_REGION: ${{ vars.NBA_STORAGE_REGION || 'auto' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NBA_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NBA_STORAGE_SECRET_ACCESS_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && secrets.BRAVE_SEARCH_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && secrets.ANTHROPIC_API_KEY || '' }}
          REQUESTED_MODE: ${{ inputs.mode }}
          APPROVED_GAME_ID: ${{ inputs.game_id }}
          AUTHORIZATION_EXPIRES: ${{ inputs.expires }}
          APPROVED_GAME_LIMIT: ${{ inputs.game_limit }}
          APPROVED_AUTOMATIC: ${{ inputs.automatic_enrollment }}
        run: |
          umask 077
          args=(--state "$RUNNER_TEMP/nba-private-state" --allow-network)
          mode="${REQUESTED_MODE:-live}"
          case "$mode" in
            bootstrap) args+=(--bootstrap) ;;
            discover) args+=(--discover-only) ;;
            repair-discover) args+=(--discover-only --source-clock-rerun --confirm-old-runner-terminated CONFIRMED_OLD_RUNNER_TERMINATED) ;;
            authorize) args+=(--authorize --confirm-authorized-campaign --game-id "$APPROVED_GAME_ID" --expires "$AUTHORIZATION_EXPIRES" --max-games 1 --max-usd 50) ;;
            expand)
              args+=(--expand --confirm-authorized-campaign --expires "$AUTHORIZATION_EXPIRES" --max-games "$APPROVED_GAME_LIMIT" --max-usd 50)
              if test "$APPROVED_AUTOMATIC" = true; then args+=(--automatic); fi
              ;;
            status) args+=(--status) ;;
            replay) args+=(--replay) ;;
            live) args+=(--live --allow-search --allow-inference) ;;
            *) exit 2 ;;
          esac
          .venv/bin/python scripts/actions_prospective.py "${args[@]}"
      # No upload-artifact, cache, raw log dump, or automatic retry step.
